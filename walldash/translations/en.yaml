configuration:
  log_level:
    name: Log level
    description: Verbosity of the add-on logs.
  domain:
    name: Domain
    description: >-
      Public hostname used for CORS and same-origin checks, with or without
      https:// (for example walldash.domain.tld). Set it when a reverse proxy
      rewrites the Host header.
  token_secret:
    name: Token secret
    description: >-
      Optional HS256 signing key for access/refresh tokens (at least 32 bytes).
      Leave empty to auto-generate and persist one in /data.
  secret_key:
    name: Secret key
    description: >-
      Optional 32-byte key-encryption key for the stored token signing key. Because
      the add-on options file and the database share the /data volume, this option
      alone does not protect against full /data snapshots; prefer secret_key_file on
      a path excluded from backups. Keep it stable: removing it after use fails closed.
  secret_key_file:
    name: Secret key file
    description: >-
      Path to a file containing the key-encryption key (whitespace-trimmed, exactly
      32 bytes), read when secret_key is empty. Point it at an operator-mounted path
      excluded from backups to protect against snapshots that leave the host. An
      unreadable or empty file aborts startup. Ignored when secret_key is set.
  allowed_origins:
    name: Allowed origins
    description: >-
      Optional comma-separated trusted origins for CORS and same-origin checks.
      Only needed when a reverse proxy rewrites the Host header.
  rescue_mode:
    name: Rescue mode
    description: >-
      Recovery switch. When enabled, the next device that opens Walldash claims the
      owner role, even if other devices already exist. Use it only to recover from a
      lost owner device, then set it back to false: the mode is consumed after a
      single use and a restart re-arms it.
network:
  8080/tcp: Walldash web interface (direct access, no Home Assistant login required).
