configuration:
  log_level:
    name: Log level
    description: Verbosity of the add-on logs.
  domain:
    name: Domain
    description: >-
      Public hostname used for CORS and same-origin checks, with or without
      https:// (for example walldash.domain.tld). Set it when a reverse proxy
      rewrites the Host header.
  token_secret:
    name: Token secret
    description: >-
      Optional HS256 signing key for access/refresh tokens (at least 32 bytes).
      Leave empty to auto-generate and persist one in /data.
  secret_key:
    name: Secret key
    description: >-
      Optional 32-character key-encryption key. When set, the auto-generated token
      signing key is encrypted (AES-256-GCM) before being stored, so database copies
      and Home Assistant snapshots no longer expose it. Keep it stable and backed up:
      if it is lost the stored signing key cannot be decrypted and devices must
      re-enroll. Do not remove it once set.
  allowed_origins:
    name: Allowed origins
    description: >-
      Optional comma-separated trusted origins for CORS and same-origin checks.
      Only needed when a reverse proxy rewrites the Host header.
  rescue_mode:
    name: Rescue mode
    description: >-
      Recovery switch. When enabled, the next device that opens Walldash claims the
      owner role, even if other devices already exist. Use it only to recover from a
      lost owner device, then set it back to false: the mode is consumed after a
      single use and a restart re-arms it.
network:
  8080/tcp: Walldash web interface (direct access, no Home Assistant login required).
