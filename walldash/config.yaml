name: Walldash
version: "1.4.1"
slug: walldash
description: Touch-first 3D home automation dashboard for wall-mounted tablets.
url: https://github.com/JLugagne/walldash
arch:
  - amd64
  - aarch64
init: false
image: ghcr.io/jlugagne/walldash
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Walldash web interface (direct access, no Home Assistant login required)
webui: http://[HOST]:[PORT:8080]/
boot: auto
startup: application
homeassistant_api: true
map:
  - type: data
    read_only: false
options:
  log_level: info
  domain: ""
  token_secret: ""
  secret_key: ""
  secret_key_file: ""
  allowed_origins: ""
  rescue_mode: false
schema:
  log_level: list(debug|info|warn|error)
  domain: str?
  token_secret: password?
  secret_key: password?
  secret_key_file: str?
  allowed_origins: str?
  rescue_mode: bool
watchdog: http://[HOST]:8080/api/health
panel_icon: mdi:tablet-dashboard
stage: experimental
